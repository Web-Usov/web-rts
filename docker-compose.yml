# LAN startup for the foundation vertical slice.
# Internal game-server listen port stays 2567. GAME_SERVER_PORT is the host port.
name: web-rts

services:
  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    environment:
      PORT: "2567"
    ports:
      - "${GAME_SERVER_PORT:-2567}:2567"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2567/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GAME_SERVER_URL: ${GAME_SERVER_URL:-}
        VITE_GAME_SERVER_PORT: ${GAME_SERVER_PORT:-2567}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      game-server:
        condition: service_healthy
