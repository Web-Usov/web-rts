name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Pushes to main always receive the full CI pipeline.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Push event: running full CI."
            exit 0
          fi

          # Triple-dot matches the PR diff (merge-base -> head). Disable rename
          # detection so code -> docs renames expose both old and new paths.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              AGENTS.md|README.md|*.md|docs/*|.agents/*|skills-lock.json|LICENSE*|NOTICE*)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  asset-validation:
    name: asset-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image validator dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Validator regression self-test
        run: python scripts/validate_assets.py --self-test

      - name: Validate tracked image assets
        run: python scripts/validate_assets.py

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: unit-tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  simulation-tests:
    name: simulation-tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Simulation scenario tests
        run: pnpm test:simulation

  server-integration:
    name: server-integration
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server integration tests
        run: pnpm test:server

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  browser-e2e:
    name: browser-e2e
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker-lan-smoke:
    name: docker-lan-smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_PORT: "18080"
      GAME_SERVER_PORT: "18081"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Docker LAN smoke
        run: pnpm test:docker-smoke

      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - asset-validation
      - lint
      - typecheck
      - unit-tests
      - simulation-tests
      - server-integration
      - build
      - browser-e2e
      - docker-lan-smoke
    steps:
      - name: Verify required CI results
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ASSET_VALIDATION_RESULT: ${{ needs.asset-validation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          SIMULATION_TESTS_RESULT: ${{ needs.simulation-tests.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server-integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          DOCKER_LAN_SMOKE_RESULT: ${{ needs.docker-lan-smoke.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$ASSET_VALIDATION_RESULT" != "success" ]]; then
            echo "asset-validation job failed: $ASSET_VALIDATION_RESULT"
            exit 1
          fi

          results=(
            "$LINT_RESULT"
            "$TYPECHECK_RESULT"
            "$UNIT_TESTS_RESULT"
            "$SIMULATION_TESTS_RESULT"
            "$SERVER_INTEGRATION_RESULT"
            "$BUILD_RESULT"
            "$BROWSER_E2E_RESULT"
            "$DOCKER_LAN_SMOKE_RESULT"
          )

          if [[ "$DOCS_ONLY" == "true" ]]; then
            for result in "${results[@]}"; do
              if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                echo "Unexpected docs-only CI result: $result"
                exit 1
              fi
            done
            echo "Docs-only PR: asset validation passed; heavy CI jobs were safely skipped."
            exit 0
          fi

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Full CI requires all heavy jobs to succeed; got: $result"
              exit 1
            fi
          done

          echo "Full CI passed."
