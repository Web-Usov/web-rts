name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regression tests for branch names
        run: node --test scripts/validate-branch-name.test.mjs

      - name: Validate PR head branch
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # PR #86 predates this convention. Preserve its existing branch.
          if [[ "$PR_NUMBER" == "86" && "$PR_HEAD_REF" == "codex/meshy-viewer" ]]; then
            echo "Grandfathered pre-convention PR #86: $PR_HEAD_REF"
            exit 0
          fi

          node scripts/validate-branch-name.mjs "$PR_HEAD_REF"

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Pushes to main always receive the full CI pipeline.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Push event: running full CI."
            exit 0
          fi

          # Triple-dot matches the PR diff (merge-base -> head). Disable rename
          # detection so code -> docs renames expose both old and new paths.
          git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              AGENTS.md|README.md|*.md|docs/*|.agents/*|skills-lock.json|LICENSE*|NOTICE*)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  knowledge-base:
    name: knowledge-base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: KB regression tests
        run: node --test scripts/knowledge-base.test.mjs

      - name: Validate current KB sources
        run: node scripts/knowledge-base.mjs check

      - name: Build deterministic index
        run: node scripts/knowledge-base.mjs index

  asset-validation:
    name: asset-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image validator dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Validator regression self-test
        run: python scripts/validate_assets.py --self-test

      - name: Validate tracked image assets
        run: python scripts/validate_assets.py

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: unit-tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  simulation-tests:
    name: simulation-tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Simulation scenario tests
        run: |
          set -o pipefail
          mkdir -p .artifacts/verification/gameplay
          pnpm test:simulation 2>&1 | tee .artifacts/verification/gameplay/simulation-tests.log

      - name: Gameplay evidence gates
        run: |
          set -euo pipefail
          output=".artifacts/verification/gameplay"
          mkdir -p "$output"

          pnpm --silent verify:gameplay move > "$output/move.json" 2> "$output/move.log"
          pnpm --silent verify:gameplay combat > "$output/combat.json" 2> "$output/combat.log"
          pnpm --silent verify:gameplay permanent-leave > "$output/permanent-leave.json" 2> "$output/permanent-leave.log"

          # Reuse the same verification oracle as the existing negative Vitest gate.
          # This is a deliberately wrong expectation, not a gameplay code mutation.
          node --input-type=module > "$output/wrong-expectation.json" 2> "$output/wrong-expectation.log" <<'NODE'
          import { verifyGameplay } from "./packages/testkit/dist/index.js";
          import { gameplayScenario } from "./tools/scenario-runner/dist/verification-scenarios.js";
          const scenario = gameplayScenario("move");
          const execute = scenario.execute;
          scenario.execute = () => {
            const result = execute();
            return {
              ...result,
              checks: result.checks.map((check) =>
                check.id === "arrived-at-target"
                  ? { ...check, expected: { x: 999, y: -3 } }
                  : check,
              ),
            };
          };
          const report = verifyGameplay(scenario);
          console.log(JSON.stringify(report, null, 2));
          if (
            report.status !== "FAIL" ||
            report.firstMismatchTick !== 120 ||
            report.checks.find((check) => check.id === "arrived-at-target")?.status !== "FAIL"
          ) {
            console.error("Expected mismatch was not detected");
            process.exitCode = 1;
          } else {
            console.error("Expected FAIL: wrong MOVE expectation detected");
          }
          NODE

          set +e
          node tools/scenario-runner/dist/cli.js missing > "$output/unknown.json" 2> "$output/unknown.log"
          unknown_exit=$?
          node tools/scenario-runner/dist/cli.js > "$output/malformed.json" 2> "$output/malformed.log"
          malformed_exit=$?
          set -e
          test "$unknown_exit" -eq 2
          test "$malformed_exit" -eq 2

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          for (const [name, expected] of [
            ["move", "PASS"], ["combat", "PASS"], ["permanent-leave", "PASS"], ["wrong-expectation", "FAIL"],
            ["unknown", "FAIL"], ["malformed", "FAIL"],
          ]) {
            const report = JSON.parse(readFileSync(`.artifacts/verification/gameplay/${name}.json`, "utf8"));
            assert.equal(report.schemaVersion, 1);
            assert.equal(report.status, expected, name);
          }
          NODE
          cat "$output/move.log" "$output/combat.log" "$output/wrong-expectation.log" "$output/unknown.log" "$output/malformed.log"

      - name: Upload gameplay verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-verification-evidence
          path: .artifacts/verification/gameplay/
          if-no-files-found: warn
          retention-days: 14

  server-integration:
    name: server-integration
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server integration tests
        run: pnpm test:server

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  browser-e2e:
    name: browser-e2e
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build

      - name: Browser E2E
        env:
          F7_SAVE_VERIFICATION_SHOTS: "1"
          VERIFICATION_DIR: .artifacts/verification/browser
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
            .artifacts/verification/browser/
          if-no-files-found: warn
          retention-days: 14

  docker-lan-smoke:
    name: docker-lan-smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_PORT: "18080"
      GAME_SERVER_PORT: "18081"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Docker LAN smoke
        run: pnpm test:docker-smoke

      - name: Show Compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - branch-name
      - changes
      - asset-validation
      - knowledge-base
      - lint
      - typecheck
      - unit-tests
      - simulation-tests
      - server-integration
      - build
      - browser-e2e
      - docker-lan-smoke
    steps:
      - name: Verify required CI results
        env:
          BRANCH_NAME_RESULT: ${{ needs.branch-name.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          KNOWLEDGE_BASE_RESULT: ${{ needs.knowledge-base.result }}
          ASSET_VALIDATION_RESULT: ${{ needs.asset-validation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          SIMULATION_TESTS_RESULT: ${{ needs.simulation-tests.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server-integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          DOCKER_LAN_SMOKE_RESULT: ${{ needs.docker-lan-smoke.result }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH_NAME_RESULT" != "success" ]]; then
            echo "branch-name job failed: $BRANCH_NAME_RESULT"
            exit 1
          fi

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$ASSET_VALIDATION_RESULT" != "success" ]]; then
            echo "asset-validation job failed: $ASSET_VALIDATION_RESULT"
            exit 1
          fi

          if [[ "$KNOWLEDGE_BASE_RESULT" != "success" ]]; then
            echo "Knowledge base validation failed: $KNOWLEDGE_BASE_RESULT"
            exit 1
          fi

          results=(
            "$LINT_RESULT"
            "$TYPECHECK_RESULT"
            "$UNIT_TESTS_RESULT"
            "$SIMULATION_TESTS_RESULT"
            "$SERVER_INTEGRATION_RESULT"
            "$BUILD_RESULT"
            "$BROWSER_E2E_RESULT"
            "$DOCKER_LAN_SMOKE_RESULT"
          )

          if [[ "$DOCS_ONLY" == "true" ]]; then
            for result in "${results[@]}"; do
              if [[ "$result" != "success" && "$result" != "skipped" ]]; then
                echo "Unexpected docs-only CI result: $result"
                exit 1
              fi
            done
            echo "Docs-only PR: asset/KB validation passed; heavy CI jobs were safely skipped."
            exit 0
          fi

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "Full CI requires all heavy jobs to succeed; got: $result"
              exit 1
            fi
          done

          echo "Full CI passed."
